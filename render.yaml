# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Two services: the Express API and the Vue frontend as a static site.
services:
  - type: web
    name: campus-events-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Free instances have no persistent disk, so the data lives in a managed Postgres (e.g. Neon).
      # Secret: paste the connection string on the dashboard. Without it the API falls back to
      # SQLite, and every restart would wipe the data.
      - key: DATABASE_URL
        sync: false
      # The frontend may open the live notification stream (SSE) directly: the static site's
      # /api rewrite below holds streaming responses back. Update if the web URL changes.
      - key: NOTIFICATIONS_ALLOWED_ORIGIN
        value: https://campus-events-web-6ogn.onrender.com
      # Secret: RabbitMQ URL (e.g. CloudAMQP). Carries the confirmation mails and notifications.
      - key: AMQP_URL
        sync: false
      # Secret: fill in on the dashboard. Without it, mails are only logged.
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: campus-events-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      # Build-time: the live notification stream goes straight to the API (see the rewrite note).
      - key: VITE_NOTIFICATIONS_URL
        value: https://campus-events-api-y8n4.onrender.com/api/notifications
    routes:
      # Same trick as the Vite dev proxy: the browser only talks to one origin, so no CORS.
      # If Render gives the API a different URL, update it here.
      - type: rewrite
        source: /api/*
        destination: https://campus-events-api-y8n4.onrender.com/api/*
      # SPA fallback so Vue Router deep links (e.g. /events/3) work on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
